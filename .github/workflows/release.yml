name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 9.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: NuGet pack
        run: dotnet pack src/Aer.Core/Aer.Core.csproj -c Release -o artifacts
      - name: Publish NuGet
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env: { NUGET_API_KEY: '${{ secrets.NUGET_API_KEY }}' }
      - name: Build npm
        working-directory: implementations/typescript
        run: npm ci && npm run build && npm publish --access public
        env: { NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}' }
      - name: Build PyPI
        working-directory: implementations/python
        run: python -m pip install --upgrade build && python -m build
      - name: Publish PyPI
        working-directory: implementations/python
        run: python -m pip install --upgrade twine && python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: '${{ secrets.PYPI_TOKEN }}'
      - name: GitHub release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
