name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore core
        run: dotnet restore src/Aer.Core/Aer.Core.csproj

      - name: Build core
        run: dotnet build src/Aer.Core/Aer.Core.csproj --configuration Release --no-restore

      - name: Build ASP.NET Core adapter
        run: dotnet build src/Aer.AspNetCore/Aer.AspNetCore.csproj --configuration Release

      - name: Build MCP adapter
        run: dotnet build src/Aer.Mcp/Aer.Mcp.csproj --configuration Release

      - name: Build CLI
        run: dotnet build src/Aer.Cli/Aer.Cli.csproj --configuration Release

      - name: Run conformance and negative-input suite
        run: dotnet run --project tests/Aer.Conformance/Aer.Conformance.csproj --configuration Release

      - name: Run benchmark smoke test
        run: dotnet run --project benchmarks/Aer.Benchmarks.csproj --configuration Release

      - name: Pack NuGet package
        run: dotnet pack src/Aer.Core/Aer.Core.csproj --configuration Release --no-build --output ./artifacts

      - name: Verify package exists
        run: test -s ./artifacts/AER.0.1.0.nupkg
