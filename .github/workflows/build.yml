name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore core
        run: dotnet restore src/Aer.Core/Aer.Core.csproj

      - name: Build core
        run: dotnet build src/Aer.Core/Aer.Core.csproj --configuration Release --no-restore

      - name: Build ASP.NET Core adapter
        run: dotnet build src/Aer.AspNetCore/Aer.AspNetCore.csproj --configuration Release

      - name: Build MCP adapter
        run: dotnet build src/Aer.Mcp/Aer.Mcp.csproj --configuration Release

      - name: Build orchestrator integration
        run: dotnet build src/Aer.Orchestration/Aer.Orchestration.csproj --configuration Release

      - name: Build CLI
        run: dotnet build src/Aer.Cli/Aer.Cli.csproj --configuration Release

      - name: Run conformance and negative-input suite
        run: dotnet run --project tests/Aer.Conformance/Aer.Conformance.csproj --configuration Release

      - name: Run MCP and orchestrator integration contracts
        run: dotnet run --project tests/Aer.Integration/Aer.Integration.csproj --configuration Release

      - name: Run deterministic property and fuzz suite
        run: dotnet run --project tests/Aer.Fuzz/Aer.Fuzz.csproj --configuration Release

      - name: Run benchmark smoke test
        run: dotnet run --project benchmarks/Aer.Benchmarks.csproj --configuration Release

      - name: Run AI effectiveness benchmark
        run: dotnet run --project benchmarks/effectiveness/Aer.Effectiveness.csproj --configuration Release

      - name: Measure exact AI tokens with o200k_base
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact tokenizer dependency
        run: python -m pip install --disable-pip-version-check tiktoken==0.11.0

      - name: Run exact tokenizer benchmark
        run: |
          python benchmarks/effectiveness/tokenizer/run_exact.py \
            --input artifacts/benchmarks/ai-effectiveness-tokenizer-input.json \
            --output artifacts/benchmarks/ai-effectiveness-o200k.json \
            --tokenizer o200k_base

      - name: Publish benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: aer-ai-effectiveness-report
          path: artifacts/benchmarks/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Pack NuGet package
        run: dotnet pack src/Aer.Core/Aer.Core.csproj --configuration Release --no-build --output ./artifacts

      - name: Verify package exists
        run: test -s ./artifacts/AER.0.1.0.nupkg

      - name: Smoke test NuGet package from clean consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ./artifacts/package-consumer
          dotnet new console --framework net9.0 --output ./artifacts/package-consumer --no-restore
          dotnet add ./artifacts/package-consumer package AER --version 0.1.0 --source ./artifacts --no-restore
          cat > ./artifacts/package-consumer/Program.cs <<'EOF'
          using Aer;

          var value = AerValue.Object(new Dictionary<string, AerValue>
          {
              ["status"] = AerValue.String("ok"),
              ["count"] = AerValue.Int(2)
          });

          var text = AER.Serialize(value);
          var roundTrip = AER.Deserialize(text);
          if (roundTrip.ToJsonElement().GetProperty("status").GetString() != "ok")
              return 1;

          var binary = AER.ToBinary(value);
          var binaryRoundTrip = AER.FromBinary(binary);
          if (binaryRoundTrip.ToJsonElement().GetProperty("count").GetInt64() != 2)
              return 1;

          return 0;
          EOF
          dotnet restore ./artifacts/package-consumer --source ./artifacts --source https://api.nuget.org/v3/index.json
          dotnet run --project ./artifacts/package-consumer --configuration Release --no-restore
